name: Android Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_SIGNING: ${{ secrets.RX_KEYSTORE_BASE64 != '' && secrets.RX_KEYSTORE_PASSWORD != '' && secrets.RX_KEY_ALIAS != '' && secrets.RX_KEY_PASSWORD != '' }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Configurer Gradle (avec cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Vérifier le projet et lancer les tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lintDebug testDebugUnitTest

      - name: Compiler l'APK Debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Compiler l'APK Release signé
        if: env.HAS_SIGNING == 'true'
        env:
          RX_KEYSTORE_BASE64: ${{ secrets.RX_KEYSTORE_BASE64 }}
          RX_KEYSTORE_PASSWORD: ${{ secrets.RX_KEYSTORE_PASSWORD }}
          RX_KEY_ALIAS: ${{ secrets.RX_KEY_ALIAS }}
          RX_KEY_PASSWORD: ${{ secrets.RX_KEY_PASSWORD }}
        run: |
          export RX_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          echo "$RX_KEYSTORE_BASE64" | base64 --decode > "$RX_KEYSTORE_PATH"
          ./gradlew --no-daemon assembleRelease
          rm -f "$RX_KEYSTORE_PATH"

      - name: Rassembler et vérifier les APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/RAM-Xtreme-debug.apk
          if [ "$HAS_SIGNING" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/RAM-Xtreme-release.apk
            cp dist/RAM-Xtreme-release.apk dist/RAM-Xtreme.apk
          else
            echo "::notice::Secrets de signature absents : aucun APK Release signé n'a été produit."
            cp dist/RAM-Xtreme-debug.apk dist/RAM-Xtreme.apk
          fi
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          for apk in dist/*.apk; do
            test -s "$apk"
            "$BUILD_TOOLS/apksigner" verify "$apk"
            "$BUILD_TOOLS/aapt2" dump badging "$apk" | head -1
          done
          ls -l dist

      - name: Publier les APK (artefacts)
        uses: actions/upload-artifact@v4
        with:
          name: RAM-Xtreme-apk
          path: |
            dist/RAM-Xtreme-debug.apk
            dist/RAM-Xtreme-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publier les rapports de test et de lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports
          path: |
            app/build/reports
            app/build/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Créer la GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$HAS_SIGNING" = "true" ]; then
            NOTE="RAM-Xtreme.apk est l'APK Release signé."
            FILES="dist/RAM-Xtreme.apk dist/RAM-Xtreme-release.apk dist/RAM-Xtreme-debug.apk"
          else
            NOTE="Signature Release non configurée : RAM-Xtreme.apk est l'APK Debug (installable, signé avec une clé de test)."
            FILES="dist/RAM-Xtreme.apk dist/RAM-Xtreme-debug.apk"
          fi
          gh release create "$GITHUB_REF_NAME" $FILES \
            --title "RAM Xtreme $GITHUB_REF_NAME" \
            --notes "$NOTE" \
            --generate-notes
